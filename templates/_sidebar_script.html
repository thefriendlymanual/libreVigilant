<script>
(function() {
  document.querySelectorAll('.project-section').forEach(sec => {
    const id = sec.dataset.projectId;
    const saved = localStorage.getItem('librevig-sidebar-project-' + id);
    if (saved === 'collapsed') sec.dataset.collapsed = 'true';
  });
})();

function toggleProject(projectId) {
  const sec = document.querySelector('.project-section[data-project-id="' + projectId + '"]');
  if (!sec) return;
  const nowCollapsed = sec.dataset.collapsed !== 'true';
  sec.dataset.collapsed = nowCollapsed ? 'true' : 'false';
  localStorage.setItem('librevig-sidebar-project-' + projectId, nowCollapsed ? 'collapsed' : 'expanded');
}

function showNewAsm(projectId) {
  document.getElementById('newAsmToggle-' + projectId).style.display = 'none';
  const form = document.getElementById('newAsmForm-' + projectId);
  form.style.display = 'flex';
  form.querySelector('input[name="name"]').focus();
}

function toggleProjectMenu(btn) {
  const dropdown = btn.nextElementSibling;
  const isOpen = dropdown.dataset.open === 'true';
  // Close all other open dropdowns first
  document.querySelectorAll('.project-dropdown[data-open="true"]').forEach(d => {
    d.dataset.open = 'false';
    d.previousElementSibling.setAttribute('aria-expanded', 'false');
  });
  if (!isOpen) {
    dropdown.dataset.open = 'true';
    btn.setAttribute('aria-expanded', 'true');
  }
}

document.addEventListener('click', function(e) {
  if (!e.target.closest('.project-header-wrap')) {
    document.querySelectorAll('.project-dropdown[data-open="true"]').forEach(d => {
      d.dataset.open = 'false';
      d.previousElementSibling.setAttribute('aria-expanded', 'false');
    });
  }
});

function openNewAsmModal(projectId) {
  const overlay = document.getElementById('newAsmModalOverlay');
  if (!overlay) return;
  const form = document.getElementById('newAsmModalForm');
  const nameInput = document.getElementById('newAsmModalName');
  const select = document.getElementById('newAsmModalTemplate');

  form.action = (window.LIBREVIG_CREATE_ASM_URLS || {})[projectId] || '';
  nameInput.value = '';

  select.innerHTML = '<option value="">Blank</option>';
  const assessments = (window.LIBREVIG_PROJECT_ASSESSMENTS || {})[projectId] || [];
  assessments.forEach(function(asm) {
    const opt = document.createElement('option');
    opt.value = asm.id;
    opt.textContent = 'Copy from "' + asm.name + '"';
    select.appendChild(opt);
  });

  overlay.dataset.open = 'true';
  nameInput.focus();
}

function closeNewAsmModal() {
  const overlay = document.getElementById('newAsmModalOverlay');
  if (overlay) overlay.dataset.open = 'false';
}

function showNewProject() {
  document.getElementById('newProjectToggle').style.display = 'none';
  const form = document.getElementById('newProjectForm');
  form.style.display = 'flex';
  form.querySelector('input[name="name"]').focus();
}
</script>
